# Include this file inside the graptolite.ai server block before the generic
# /api/ compatibility redirect. The longer prefix keeps the existing homepage
# and DeepSeek routes unchanged.

location ^~ /api/v1/bridge/ws/ {
    limit_req zone=graptolite_web burst=20 nodelay;

    proxy_pass http://127.0.0.1:7860;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

location ^~ /api/v1/bridge/ {
    limit_req zone=graptolite_web burst=20 nodelay;

    proxy_pass http://127.0.0.1:7860;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}
