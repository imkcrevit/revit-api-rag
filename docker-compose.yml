version: "3.8"

services:
  revit-api-rag:
    build: .
    container_name: revit-rag
    ports:
      - "7860:7860"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DATA_DIR=/app/data
    volumes:
      - ./data/sqlite:/app/data/sqlite
      - ./data/chromadb:/app/data/chromadb
    restart: unless-stopped

  homepage:
    image: nginx:alpine
    container_name: graptolite-homepage
    ports:
      - "80:80"
    volumes:
      - ./h:/usr/share/nginx/html:ro
      - ./h/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - revit-api-rag
    restart: unless-stopped
