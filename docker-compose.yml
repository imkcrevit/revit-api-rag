services:
  revit-api-rag:
    build: .
    container_name: revit-rag
    ports:
      # Bind to loopback only; nginx/Cloudflare reverse-proxies to it.
      - "127.0.0.1:7860:7860"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DATA_DIR=/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/sqlite:/app/data/sqlite
      - ./data/chromadb:/app/data/chromadb
    mem_limit: 2g
    restart: unless-stopped

  homepage:
    image: nginx:alpine
    container_name: graptolite-homepage
    ports:
      - "80:80"
    volumes:
      - ./h:/usr/share/nginx/html:ro
      - ./h/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - revit-api-rag
    restart: unless-stopped
