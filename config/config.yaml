
revit_version: "2026"

# --- HTTP 代理配置（国内环境建议开启，解决 Gemini 等模型 400/连接问题）---
proxy:
  enabled: false
  http: "http://127.0.0.1:10808"
  https: "http://127.0.0.1:10808"

# --- OpenRouter 统一配置 ---
openrouter:
  base_url: "https://openrouter.ai/api/v1"
  api_key_env: "OPENROUTER_API_KEY"

# --- LLM 配置 ---
# provider 可选: claude / openai / gemini / deepseek
# SDK 代码归纳总结推荐使用 claude 或 openai（推理质量更高）
llm:
  provider: "claude"
  models:
    claude:
      # OpenRouter 上的 Claude 模型名，可选：
      #   anthropic/claude-opus-4          — 最强，成本较高
      #   anthropic/claude-sonnet-4-5      — 性价比最高（推荐）
      #   anthropic/claude-3-5-haiku       — 最快，成本最低
      model: "anthropic/claude-sonnet-4.6"
      api_key_env: "OPENROUTER_API_KEY"
      base_url: "https://openrouter.ai/api/v1"
    
    gemini:
      model: "google/gemini-3-flash-preview"
      api_key_env: "OPENROUTER_API_KEY"
      base_url: "https://openrouter.ai/api/v1"
    gemini_flash:
      model: "google/gemini-3-flash-preview"
      api_key_env: "OPENROUTER_API_KEY"
      base_url: "https://openrouter.ai/api/v1"
    deepseek:
      model: "deepseek/deepseek-chat-v3-0324"
      api_key_env: "OPENROUTER_API_KEY"
      base_url: "https://openrouter.ai/api/v1"
  temperature: 0.3
  max_tokens: 4096

# --- Embedding 配置 ---
embedding:
  provider: "openai"
  models:
    openai:
      model: "openai/text-embedding-3-large"
      dimension: 3072
      api_key_env: "OPENROUTER_API_KEY"
      base_url: "https://openrouter.ai/api/v1"

# --- Rerank 配置 ---
rerank:
  enabled: true
  provider: "cohere"
  models:
    cohere:
      model: "cohere/rerank-v3.5"
      api_key_env: "OPENROUTER_API_KEY"
      base_url: "https://openrouter.ai/api/v1"

# --- 检索参数 ---
retrieval:
  api:
    top_k: 30
    rerank_top_n: 15
  code:
    top_k: 5
    rerank_top_n: 3

# --- 数据路径 ---
data:
  chromadb_dir: "./data/chromadb"
  sqlite_dir: "./data/sqlite"
  knowledge_dir: "./data/knowledge"

# --- Intent Bridge ---
intent:
  enabled: true
  auto_complete: true
  ask_on_ambiguity: true
  validate_output: true
  explain_result: true
  language: "zh"

# --- SDK 解析配置 ---
sdk:
  stage1_provider: "gemini_flash"   # ReadMe 解析用 (cheap + fast)
  stage2_provider: "claude"         # Golden code 生成用 (high quality)
  num_workers_phase1: 10
  num_workers_phase2: 5

# --- 服务配置 ---
server:
  host: "0.0.0.0"
  port: 8000
  gradio_port: 7860
  cors_origins: ["*"]
