# ── Rate limiting zones ────────────────────────────────────
# 10r/s per IP for general requests, 2r/s for API
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=connlimit:10m;

# ══════════════════════════════════════════════════════════
# Main domain: graptolite.ai → homepage
# ══════════════════════════════════════════════════════════
server {
    listen 80;
    server_name graptolite.ai www.graptolite.ai;

    root /usr/share/nginx/html;
    index index.html;

    # ── Global security headers ────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Connection limits ──────────────────────────────────
    limit_conn connlimit 20;

    # ── Hide server version ────────────────────────────────
    server_tokens off;

    # ── BLOCK: sensitive files (.env, credentials, keys) ───
    location ~* /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }
    location ~* \.(env|git|gitignore|dockerignore|yml|yaml|toml|ini|cfg|conf|bak|swp|old|orig|log|sql|db|sqlite|sqlite3|key|pem|crt|p12|jks)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }
    location ~* (\.env|\.git|wp-admin|wp-login|phpmyadmin|adminer|\.php|cgi-bin|\.asp|\.jsp|shell|backup|dump|config\.|credentials|secret|password|apikey|api_key|token) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # ── BLOCK: path traversal attempts ─────────────────────
    location ~* \.\./ {
        deny all;
        return 403;
    }

    # ── BLOCK: common exploit scanners ─────────────────────
    if ($http_user_agent ~* "sqlmap|nikto|nessus|dirbuster|gobuster|wpscan|masscan|zgrab") {
        return 444;
    }
    if ($request_uri ~* "union.*select|load_file|outfile|benchmark|sleep\(") {
        return 444;
    }

    # ── Chinese pages ──────────────────────────────────────
    location /zh/ {
        limit_req zone=general burst=20 nodelay;
        try_files $uri $uri/ /zh/index.html;
    }

    # ── Homepage — static files ────────────────────────────
    location / {
        limit_req zone=general burst=20 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # ── Cache static assets ────────────────────────────────
    location ~* \.(css|js|png|jpg|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Custom error pages ─────────────────────────────────
    error_page 403 404 /404.html;
    location = /404.html {
        internal;
        default_type text/html;
        return 404 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>404</title><style>body{background:#141413;color:#a8a59e;font-family:monospace;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}div{text-align:center}h1{color:#faf9f5;font-size:48px;margin-bottom:8px}p{font-size:14px;letter-spacing:2px}</style></head><body><div><h1>404</h1><p>NOT FOUND</p></div></body></html>';
    }
}

# ══════════════════════════════════════════════════════════
# Subdomain: revit-rag.graptolite.ai → Gradio app
# ══════════════════════════════════════════════════════════
server {
    listen 80;
    server_name revit-rag.graptolite.ai;

    # ── Security headers ───────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    limit_conn connlimit 20;
    server_tokens off;

    # ── BLOCK: exploit scanners ────────────────────────────
    if ($http_user_agent ~* "sqlmap|nikto|nessus|dirbuster|gobuster|wpscan|masscan|zgrab") {
        return 444;
    }
    if ($request_uri ~* "union.*select|load_file|outfile|benchmark|sleep\(") {
        return 444;
    }

    # ── Proxy all traffic to Gradio ────────────────────────
    location / {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://revit-rag:7860/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # ── API endpoints ──────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=5 nodelay;
        proxy_pass http://revit-rag:7860/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }

    # ── Health check ───────────────────────────────────────
    location /health {
        limit_req zone=api burst=5 nodelay;
        proxy_pass http://revit-rag:7860/health;
    }
}
