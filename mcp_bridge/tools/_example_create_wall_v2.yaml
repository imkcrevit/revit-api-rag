# Example: upgraded tool format with atom sources and enriched metadata
# This file is for reference only — not loaded as an actual tool (prefixed with _)

name: create_wall
display_name: Create Wall
description: Create a wall between two points on a specified level with given height

# ---- NEW: enriched metadata for tool selection ----
preconditions:
  - "项目中必须存在至少一个 Level"
  - "At least one Level must exist in the project"
applies_when:
  - "创建墙"
  - "画墙"
  - "新建墙体"
  - "create wall"
  - "draw wall"
  - "place wall"
not_for:
  - "修改墙"
  - "删除墙"
  - "墙类型"
  - "curtain wall"    # 幕墙是另一个 tool

# ---- Parameters with atom sources ----
parameters:
  - name: level_name
    type: string
    description: "目标楼层 / Target level"
    source: "query:levels"          # auto-resolved from Revit via atom
    # LLM MUST NOT guess this value — it comes from Revit

  - name: wall_type_name
    type: string
    description: "墙类型 / Wall type"
    source: "query:wall_types"      # auto-resolved from Revit via atom
    # LLM MUST NOT guess this value — it comes from Revit

  - name: start_x
    type: double
    description: "起点 X 坐标 (mm) / Start X coordinate"
    source: "ask_user"              # must ask user, cannot guess

  - name: start_y
    type: double
    description: "起点 Y 坐标 (mm) / Start Y coordinate"
    source: "ask_user"

  - name: end_x
    type: double
    description: "终点 X 坐标 (mm) / End X coordinate"
    source: "ask_user"

  - name: end_y
    type: double
    description: "终点 Y 坐标 (mm) / End Y coordinate"
    source: "ask_user"

  - name: height
    type: double
    description: "墙高 (mm) / Wall height"
    source: "default"
    default: 3000

code_template: |
  var level = new FilteredElementCollector(document)
      .OfClass(typeof(Level)).Cast<Level>()
      .FirstOrDefault(l => l.Name == "{level_name}");
  if (level == null)
      return new { Status = "Error", Message = "Level '{level_name}' not found" };

  var wallType = new FilteredElementCollector(document)
      .OfClass(typeof(WallType)).Cast<WallType>()
      .FirstOrDefault(t => t.Name == "{wall_type_name}");
  if (wallType == null)
      return new { Status = "Error", Message = "WallType '{wall_type_name}' not found" };

  XYZ start = new XYZ({start_x} / 304.8, {start_y} / 304.8, 0);
  XYZ end = new XYZ({end_x} / 304.8, {end_y} / 304.8, 0);
  Line wallLine = Line.CreateBound(start, end);

  Wall wall = Wall.Create(document, wallLine, wallType.Id, level.Id, {height} / 304.8, 0, false, false);

  return new { ElementId = wall.Id.Value, Status = "Created",
      Level = level.Name, Type = wallType.Name };

tags: [wall, create, basic]
