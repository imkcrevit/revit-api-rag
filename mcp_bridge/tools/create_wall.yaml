name: create_wall
display_name: Create Wall
description: Create a wall between two points with specified height. Uses first available
  wall type and first level.
code_template: |
  // Step 1: Get first level
  var level = new FilteredElementCollector(document)
      .OfClass(typeof(Level))
      .Cast<Level>()
      .OrderBy(l => l.Elevation)
      .First();

  // Step 2: Create wall line from mm coordinates
  XYZ start = new XYZ({start_x} / 304.8, {start_y} / 304.8, 0);
  XYZ end = new XYZ({end_x} / 304.8, {end_y} / 304.8, 0);
  Line wallLine = Line.CreateBound(start, end);

  // Step 3: Create wall (Transaction already active — do NOT create one)
  Wall wall = Wall.Create(document, wallLine, level.Id, false);
  wall.get_Parameter(BuiltInParameter.WALL_USER_HEIGHT_PARAM)
      .Set({height} / 304.8);

  return new { ElementId = wall.Id.Value, Status = "Created" };
parameters:
  - name: start_x
    type: double
    description: Wall start X (mm)
    default: '0'
  - name: start_y
    type: double
    description: Wall start Y (mm)
    default: '0'
  - name: end_x
    type: double
    description: Wall end X (mm)
    default: '5000'
  - name: end_y
    type: double
    description: Wall end Y (mm)
    default: '0'
  - name: height
    type: double
    description: Wall height (mm)
    default: '3000'
tags:
  - wall
  - create
  - basic
