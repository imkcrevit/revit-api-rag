name: create_wall
display_name: Create Wall
description: Create a wall between two points with specified height and wall type.
code_template: |
  using(Transaction tx = new Transaction(doc, "Create Wall"))
  {
      tx.Start();

      // Get level
      FilteredElementCollector levelCollector = new FilteredElementCollector(doc);
      Level level = levelCollector.OfClass(typeof(Level)).FirstElement() as Level;

      // Create line for wall
      XYZ start = new XYZ({start_x} / 304.8, {start_y} / 304.8, 0);
      XYZ end = new XYZ({end_x} / 304.8, {end_y} / 304.8, 0);
      Line wallLine = Line.CreateBound(start, end);

      // Create wall
      Wall wall = Wall.Create(doc, wallLine, level.Id, false);
      wall.get_Parameter(BuiltInParameter.WALL_USER_HEIGHT_PARAM)
          .Set({height} / 304.8);

      tx.Commit();
  }
parameters:
  - name: start_x
    type: double
    description: Wall start point X coordinate (mm)
    default: '0'
  - name: start_y
    type: double
    description: Wall start point Y coordinate (mm)
    default: '0'
  - name: end_x
    type: double
    description: Wall end point X coordinate (mm)
    default: '5000'
  - name: end_y
    type: double
    description: Wall end point Y coordinate (mm)
    default: '0'
  - name: height
    type: double
    description: Wall height (mm)
    default: '3000'
tags:
  - wall
  - create
  - basic
created_at: '2026-03-13T00:00:00'
source_query: create a 3m high wall
execution_count: 0
