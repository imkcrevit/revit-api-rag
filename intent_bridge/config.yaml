# Intent Bridge 配置
llm:
  primary:
    model: "google/gemini-3-flash-preview"
    temperature: 0.1
  fallback:
    model: "openai/gpt-5.3-codex"
    temperature: 0.1
  base_url: "https://openrouter.ai/api/v1"
  # api_key 从环境变量 OPENROUTER_API_KEY 读取
  timeout: 60
  max_retries: 2
  max_tokens: 4096

session:
  max_turns: 10
  timeout_seconds: 600

logging:
  level: "INFO"
  log_llm_calls: true
