  # ===================================================================
  # Delete Element / 删除元素
  # ===================================================================
  delete_element:
    display_name: "删除元素"
    display_name_en: "Delete Element"
    description: "删除 Revit 模型中的元素"
    description_en: "Delete elements from the Revit model"
    api_method: "Element.Delete"
    slots:
      target:
        type: object
        required: true
        ask_if_missing: "要删除什么元素？"
        ask_if_missing_en: "Which element to delete?"
        sub_slots:
          element_type:
            type: enum
            required: true
            values: [wall, floor, door, window, room, column, beam, roof]
            ask_if_missing: "什么类型的元素？"
            ask_if_missing_en: "What type of element?"
            aliases:
              # Chinese
              墙: wall
              墙体: wall
              楼板: floor
              门: door
              窗: window
              窗户: window
              房间: room
              柱: column
              柱子: column
              梁: beam
              屋顶: roof
              # English
              wall: wall
              walls: wall
              floor: floor
              slab: floor
              door: door
              doors: door
              window: window
              windows: window
              room: room
              rooms: room
              column: column
              pillar: column
              beam: beam
              roof: roof
          identifier:
            type: string
            required: false
            ask_if_missing: "哪一个？请描述位置或标识。"
            ask_if_missing_en: "Which one? Describe location or identifier."
          scope:
            type: enum
            values: [single, all_matching, filtered]
            required: false
            default_strategy: infer_from_input
            aliases:
              # Chinese
              所有: all_matching
              全部: all_matching
              这个: single
              那个: single
              # English
              all: all_matching
              every: all_matching
              all of: all_matching
              this: single
              that: single

      filter_condition:
        type: string
        required_if: "target.scope == filtered or target.scope == all_matching"
        ask_if_missing: "删除条件是什么？请描述筛选规则。"
        ask_if_missing_en: "What is the deletion filter? Describe the selection criteria."
        examples:
          - input: "非承重墙"
            value: "structural == false"
          - input: "二层的"
            value: "level == F2"
          - input: "non-structural walls"
            value: "structural == false"
          - input: "on the second floor"
            value: "level == F2"

      confirm_delete:
        type: boolean
        required: true
        default_strategy: must_confirm
        ask_if_missing: "确认要删除吗？此操作不可撤销。"
        ask_if_missing_en: "Confirm deletion? This action cannot be undone."
        constraints:
          - operator: "=="
            value: true
            message: "必须确认才能执行删除操作 / Deletion must be confirmed before execution"

      level:
        type: string
        required: false
        ask_if_missing: "在哪个标高的元素？"
        ask_if_missing_en: "At which level?"
